[project]
name = "ai-agents-in-finance"
version = "0.1.0"
description = "Finance-focused AI agent experiments"
requires-python = ">=3.11"
dependencies = [
    "accelerate",
    "chromadb",
    "financetoolkit",
    "google-genai",
    "llama-index",
    "openai",
    "openai-agents",
    "python-dotenv",
    "torch",
    "transformers",
    "yfinance",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_agents_finance"]
