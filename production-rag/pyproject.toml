[project]
name = "production-rag"
version = "0.1.0"
description = "Production RAG course labs and application"
readme = "README.md"
authors = [
    { name = "manoharaurala", email = "manoharaurala@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "fastembed>=0.7",
    "pymupdf>=1.26",
    "pytesseract>=0.3.10",
    "pillow>=10",
    "faiss-cpu>=1.8",
    "python-dotenv>=1.0",
    "tiktoken>=0.7",
    "wordllama>=0.3",
    "openai>=1.40",
    "anthropic>=0.40",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "redis>=5",
    "rq>=1.16",
    "httpx>=0.27",
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
